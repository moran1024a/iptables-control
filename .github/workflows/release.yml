name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本号
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "VERSION = \"$v\"" server/ictl-server.py || { echo "server/ictl-server.py 版本不是 $v"; exit 1; }
          grep -qx "VERSION=\"$v\"" agent/ictl.sh || { echo "agent/ictl.sh 版本不是 $v"; exit 1; }
          grep -qx "VERSION=\"$v\"" deploy/install-server.sh || { echo "deploy/install-server.sh 版本不是 $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ictl-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ictl-server:latest

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" agent/ictl.sh deploy/install-server.sh \
            --title "$GITHUB_REF_NAME" --generate-notes
