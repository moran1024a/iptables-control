name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本号
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 deploy/check-versions.py "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: 验证与构建独立 Agent
        run: |
          python3 -m unittest discover -s tests
          (cd tunnel-agent && go test ./...)
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd tunnel-agent && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o ../dist/tunnel-agent-linux-$arch .)
          done
          cp agent/ictl.sh deploy/install-server.sh tunnel-agent/install-tunnel.sh server/components.json dist/
          (cd dist && sha256sum ictl.sh install-server.sh install-tunnel.sh components.json tunnel-agent-linux-* > SHA256SUMS)

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ictl-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ictl-server:latest

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
