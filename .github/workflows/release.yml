name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本号
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 deploy/check-versions.py "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 验证与打包
        run: |
          python3 -m unittest discover -s tests
          node --check server/web/app.js
          for file in agent/ictl.sh deploy/install-server.sh ipt.sh; do bash -n "$file"; done
          mkdir -p dist
          cp agent/ictl.sh deploy/install-server.sh server/components.json dist/
          (cd dist && sha256sum ictl.sh install-server.sh components.json > SHA256SUMS)

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ictl-server:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ictl-server:latest

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if ($2 == version) found = 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
