name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查版本号
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 deploy/check-versions.py "$v"
          # 在推送镜像之前确认 CHANGELOG 有本版本的说明，避免只发布镜像而没有 Release 文件。
          awk -v version="$v" '
            /^## / { if (found) exit; if ($2 == version) found = 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${{ github.repository_owner }}/ictl-server:$v" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${{ github.repository_owner }}/ictl-server:$v,ghcr.io/${{ github.repository_owner }}/ictl-server:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/active/go.mod
          cache-dependency-path: agent/active/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建并检查面板
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          node dev/size-check.mjs ../server/web
          mkdir -p "$RUNNER_TEMP/web-assets/out"
          cp -r ../server/web/. "$RUNNER_TEMP/web-assets/out/"

      - name: 验证与打包
        run: |
          python3 -m pip install -r server/requirements.txt
          python3 -m unittest discover -s tests
          for file in agent/*.sh deploy/*.sh ipt.sh; do bash -n "$file"; done
          # 用真实服务端和浏览器走一遍面板的主要流程。
          if command -v google-chrome >/dev/null; then (cd web && npm run e2e)
          else (cd web && npx playwright-core install --with-deps chromium && ICTL_BROWSER_CHANNEL=bundled npm run e2e); fi
          mkdir -p dist
          (cd agent/active && go test ./...)
          (cd agent/wake && go test ./...)
          for arch in amd64 arm64; do
            (cd agent/active && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../../dist/ictl-active-linux-$arch .)
            (cd agent/wake && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o ../../dist/ictl-wake-linux-$arch .)
          done
          cp agent/*.sh deploy/install-server.sh deploy/install-agent.sh server/components.json ipt.sh dist/
          (cd dist && sha256sum *.sh components.json ictl-active-* ictl-wake-* > SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/agent-assets/out"
          cp dist/ictl-*-linux-* "$RUNNER_TEMP/agent-assets/out/"

      - name: 验证隔离网络中的实际转发
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables iproute2 conntrack
          sudo unshare -nm env ICTL_KERNEL_TEST=1 python3 tests/kernel_network.py "$PWD/dist/ictl-active-linux-amd64"
          sudo unshare -n python3 tests/kernel_wake.py "$PWD/dist/ictl-wake-linux-amd64"
          (cd agent/active && go test -c -o "$RUNNER_TEMP/ictl-active-test")
          sudo unshare -n env ICTL_KERNEL_TEST=1 "$RUNNER_TEMP/ictl-active-test" -test.run '^TestKernelForwardingHealth$'
          sudo unshare -nm python3 tests/kernel_multi_ip.py "$PWD/dist/ictl-active-linux-amd64" "$RUNNER_TEMP/ictl-active-test"
          sudo unshare -nm python3 tests/kernel_switch.py "$PWD/dist/ictl-active-linux-amd64"
          sudo unshare -nm python3 tests/kernel_quality.py "$PWD/dist/ictl-active-linux-amd64" "$RUNNER_TEMP/ictl-active-test"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 复用已打包和验证的二进制，覆盖 Dockerfile 中同名的编译阶段。
          build-contexts: |
            agent-build=${{ runner.temp }}/agent-assets
            web-build=${{ runner.temp }}/web-assets
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          # 标签触发的发布通过 registry 共享缓存，避免每个新标签从头构建。
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ictl-server:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ictl-server:buildcache,mode=max,ignore-error=true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
